services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: quorum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quorum
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - quorum-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quorum -d quorum"]
      interval: 5s
      timeout: 5s
      retries: 20

  loki:
    image: grafana/loki:3.5.12
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "127.0.0.1:3100:3100"

  tempo:
    image: grafana/tempo:2.8.4
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "127.0.0.1:3200:3200"

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--storage.tsdb.retention.time=14d"
      - "--web.config.file=/etc/prometheus/web.yml"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/.run/web.yml:/etc/prometheus/web.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otel/config.yaml"]
    environment:
      PROMETHEUS_USER: quorum
      PROMETHEUS_PASSWORD: ${PROMETHEUS_PASSWORD}
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otel/config.yaml:ro
      - ./deploy/.run/htpasswd:/etc/otel/auth/htpasswd:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      - loki
      - tempo
      - prometheus

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_PATHS_CONFIG: /etc/grafana/grafana.ini
      PROMETHEUS_PASSWORD: ${PROMETHEUS_PASSWORD}
    volumes:
      - ./deploy/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
      - prometheus
      - tempo

  quorum:
    build:
      context: .
      dockerfile: src/Quorum.App/Dockerfile
    image: quorum:local
    container_name: quorum
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Quorum: Host=postgres;Port=5432;Database=quorum;Username=quorum;Password=${POSTGRES_PASSWORD}
      Telemetry__OtlpEndpoint: http://otel-collector:4318
      Telemetry__CollectorUser: quorum
      Telemetry__CollectorPassword: ${COLLECTOR_PASSWORD}
      Telemetry__GrafanaAdminPassword: ${GRAFANA_ADMIN_PASSWORD}
      Telemetry__PrometheusPassword: ${PROMETHEUS_PASSWORD}
      PublicBaseUrl: ${PUBLIC_BASE_URL}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

volumes:
  quorum-postgres:
